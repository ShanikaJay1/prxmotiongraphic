<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>AD-008 Motion</title>
<style>
  @font-face{font-family:"Druk Wide";src:url("../layout/src/ds/DrukWide-Bold.ttf") format("truetype");font-weight:700}
  @font-face{font-family:Poppins;src:url("../layout/src/ds/Poppins-Regular.woff2") format("woff2");font-weight:400}
  @font-face{font-family:Poppins;src:url("../layout/src/ds/Poppins-Bold.woff2") format("woff2");font-weight:700}
  :root{--RokiRed:#8a0000;--ink:#080808;--paper:#ffffff;--ink-muted:#5a5a5a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#111}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
  .abs{position:absolute}
  .ph{position:absolute;overflow:hidden}
  .ph .in{position:absolute;inset:0;transform-origin:50% 50%}
  .ph img{position:absolute;display:block;filter:contrast(1.12) brightness(.92) saturate(.9)}
  .ph::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(8,8,8,.85) 30%,transparent 33%) 0 0/5px 5px;opacity:.2;mix-blend-mode:multiply;pointer-events:none}
  .hl{font-family:"Druk Wide","Arial Black",sans-serif;font-weight:700;text-transform:uppercase;white-space:nowrap;letter-spacing:-1px;line-height:.92;color:var(--ink);filter:url(#rough)}
  .hl span.l{display:block}
  .cta{font-family:Poppins,Arial,sans-serif;font-weight:700;line-height:1.1;text-transform:uppercase}
  .cap{font-family:Poppins,Arial,sans-serif;font-weight:400;line-height:1.3}
  .mk{-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
  .wm{position:absolute;left:60px;bottom:300px;width:210px;z-index:50}
  .ch{position:absolute;right:60px;top:300px;width:190px;z-index:50}
  #grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.07;filter:url(#grain);background:#fff;z-index:60}
  #paper{position:absolute;inset:0;background-size:100% 100%;mix-blend-mode:multiply;opacity:.4;z-index:1}
  .scene{position:absolute;inset:0;z-index:10;visibility:hidden}
  #hud{position:fixed;left:8px;top:8px;font:12px monospace;color:#fff;background:#000a;padding:4px 6px;z-index:999}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence id="tGrain" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence id="tRough" type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="roughB" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence id="tRoughB" type="fractalNoise" baseFrequency=".03" numOctaves="3" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<div id="stage"></div>
<div id="hud"></div>
<script>
// ===== Timeline (seconds). Beats and durations from BR-008. 24 fps, stepped (held) motion, no blur. =====
const FPS=24, TOTAL=13;
const T_HOOK=0, T_ROSTER=2, SEG=1.4, T_LINEUP=9, T_CLOSE=11;
const frame=t=>Math.floor(t*FPS+1e-6);
const held=(t,n)=>Math.floor(frame(t)/n);

// ===== Layout constants: identical to the approved layout (layout/hifi, v=6) =====
const DS='../layout/src/ds/', GR='../layout/src/grunge/';
const M=60, PX=60, PY=400, PW=960, PH=860;
const IMG={'grappler-08':[1280,1600],'grappler-03':[1280,1600],'grappler-07':[1280,1600],'kamogawa-04':[1279,1600],'dragon-03':[1281,1600],'sendo-04':[1280,1600],'gomu-onbody':[1333,2000]};
const FOC={'grappler-08':[.5,.45,1.05],'grappler-07':[.45,.6,1.1],'kamogawa-04':[.71,.85,1.35],'grappler-03':[.55,.4,1.1],'dragon-03':[.45,.6,1.1],'sendo-04':[.6,.6,1.1],'gomu-onbody':[.5,.6,2.4]};
const TGT={'grappler-08':[.36,.5],'grappler-07':[.5,.6],'kamogawa-04':[.6,.55],'grappler-03':[.55,.42],'dragon-03':[.4,.55],'sendo-04':[.58,.55],'gomu-onbody':[.5,.48]};
const ROSTER=[{n:'KAMOGAWA',img:'kamogawa-04'},{n:'THE GRAPPLER',img:'grappler-03'},{n:'THE DRAGON',img:'dragon-03'},{n:'SENDO',img:'sendo-04'},{n:'GOMU',img:'gomu-onbody'}];
const HOOK='grappler-08', CLOSE='grappler-07';

function ph(src,x,y,w,h,o={}){
  const [iw,ih]=IMG[src];const f=FOC[src];const fx=f[0],fy=f[1],z=f[2];
  const s=Math.max(w/iw,h/ih)*(o.center?Math.max(z,1.3):z),dw=iw*s,dh=ih*s;
  let l=(w-dw)*fx,t=(h-dh)*fy;
  // center: wrap in the middle, never cropping above the photo's own face-safe line
  if(o.center){const [tx,ty]=TGT[src];l=Math.min(0,Math.max(w-dw,w/2-tx*dw));const s0=Math.max(1080/iw,1920/ih)*z;const tMin=(1920-ih*s0)*fy/(ih*s0)*dh;t=Math.min(tMin,Math.max(h-dh,h/2-ty*dh));}
  return `<div class="ph" ${o.id?`id="${o.id}"`:''} style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><div class="in"><img src="${DS}${src}.jpg" style="width:${dw}px;height:${dh}px;left:${l}px;top:${t}px"></div></div>`;
}
const rr=(x,y,w,h,sw,id='')=>`<svg class="abs" ${id?`id="${id}"`:''} style="left:${x-12}px;top:${y-12}px;overflow:visible;z-index:5" width="${w+24}" height="${h+24}"><rect x="${12+sw/2}" y="${12+sw/2}" width="${w-sw}" height="${h-sw}" fill="none" stroke="#080808" stroke-width="${sw}" filter="url(#roughB)"/></svg>`;
const mark=(file,id,x,y,w,h,color,extra='')=>`<div class="abs mk" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${color};-webkit-mask-image:url(${GR}${file}.png);mask-image:url(${GR}${file}.png);z-index:8;${extra}"></div>`;

// ===== Build DOM once =====
const st=document.getElementById('stage');
st.innerHTML=`<div id="paper"></div>
<div class="scene" id="sHook">${ph(HOOK,PX,PY,PW,PH,{center:1,id:'pHook'})}${rr(PX,PY,PW,PH,10,'fHook')}
  <div class="hl abs" id="hHook" data-fit="960" data-max="64" style="left:${M}px;top:1340px"><span class="l" id="hk1">FIVE WRAPS.</span><span class="l" id="hk2">PICK YOUR <span id="hkW" style="color:var(--RokiRed)">FIGHTER.</span></span></div>
  ${mark('stroke_1','ulHook',0,0,10,30,'var(--RokiRed)')}</div>
<div class="scene" id="sRoster">${ROSTER.map((r,i)=>ph(r.img,PX,PY,PW,PH,{center:1,id:'pR'+i})).join('')}${rr(PX,PY,PW,PH,10,'fRoster')}
  ${ROSTER.map((r,i)=>`<div class="hl abs" id="nR${i}" data-fit="960" data-max="88" style="left:${M}px;top:1290px">${r.n}</div>`).join('')}
  ${ROSTER.map((r,i)=>{const x=M+i*196;return `<div id="th${i}">${ph(r.img,x,1400,176,120,{center:1,id:'thp'+i})}${rr(x,1400,176,120,4,'thf'+i)}</div>`;}).join('')}
  ${mark('circle_0','cR',0,1366,268,188,'var(--RokiRed)')}</div>
<div class="scene" id="sLine">${ROSTER.map((r,i)=>{const x=M+i*194;return `<div id="ls${i}">${ph(r.img,x,PY,184,960,{center:1})}${rr(x,PY,184,960,6)}</div>`;}).join('')}
  <div class="hl abs" id="hLine" data-fit="960" data-max="64" style="left:${M}px;top:1400px">THE FULL <span id="lnW" style="color:var(--RokiRed)">ROSTER</span></div>
  ${mark('stroke_2','ulLine',0,0,10,30,'var(--RokiRed)')}</div>
<div class="scene" id="sClose">${ph(CLOSE,PX,PY,PW,PH,{center:1,id:'pClose'})}${rr(PX,PY,PW,PH,10)}
  <div class="cta abs" id="shop" style="left:${M+40}px;top:1330px;color:var(--RokiRed);font-size:56px;z-index:9">SHOP NOW</div>
  ${mark('circle_1','cClose',M-14,1286,420,160,'var(--RokiRed)')}
  <div class="abs" id="arWrap" style="left:450px;top:1250px;width:240px;height:240px;transform:scaleX(-1);z-index:8">${mark('arrow_1','arClose',0,0,240,240,'var(--ink)')}</div>
  <div class="cap abs" id="url" style="left:${M}px;top:1470px;color:var(--ink-muted);font-size:34px">rokiovertime.com</div></div>
<img class="wm" src="${DS}roki-wordmark-black.png" alt="ロキ roki"><img class="ch" src="${DS}choten-block-black.png" alt="頂点へ">
<div id="grain"></div>`;
const $=id=>document.getElementById(id);

// ===== Helpers (all pure functions of t) =====
const STAMP=[1.12,1.06,1];                    // scale over 3 frames
const JOLT=[[6,-4],[-4,3],[0,0]];             // paper jolt, held per frame
function stamp(el,t,t0,base=''){             // hard cut + stamp entrance at t0
  const f=frame(t)-frame(t0);
  if(f<0){el.style.visibility='hidden';return;}
  el.style.visibility='inherit';const k=Math.min(f,2);
  el.style.transform=`${base} translate(${JOLT[k][0]}px,${JOLT[k][1]}px) scale(${STAMP[k]})`;
}
function cutIn(el,t,t0){el.style.visibility=frame(t)>=frame(t0)?'inherit':'hidden';}
// stepped left-to-right wipe (brush underline): steps of 2 frames
function wipe(el,t,t0,steps=6,fromRight=false){
  const f=frame(t)-frame(t0);if(f<0){el.style.visibility='hidden';return;}
  el.style.visibility='inherit';const p=Math.min(1,(Math.floor(f/2)+1)/steps)*100;
  el.style.clipPath=fromRight?`inset(0 0 0 ${100-p}%)`:`inset(0 ${100-p}% 0 0)`;
}
// stepped pie sweep (hand-drawn circle draws on around its centre)
function sweep(el,t,t0,steps=5,a0=-90){
  const f=frame(t)-frame(t0);if(f<0){el.style.visibility='hidden';return;}
  el.style.visibility='inherit';const p=Math.min(1,(Math.floor(f/2)+1)/steps);
  if(p>=1){el.style.clipPath='none';return;}
  const pts=['50% 50%'];for(let k=0;k<=24;k++){const a=(a0+360*p*k/24)*Math.PI/180;pts.push(`${50+80*Math.cos(a)}% ${50+80*Math.sin(a)}%`);}
  el.style.clipPath=`polygon(${pts.join(',')})`;
}
// push-in inside a panel, stepped on fours
function push(el,t,t0,dur,amt=.04){const n=Math.max(1,Math.floor(dur*FPS/4));const k=Math.min(n,Math.max(0,held(t-t0,4)));el.querySelector('.in').style.transform=`scale(${1+amt*k/n})`;}
function underline(spanId,ulId){                // place a brush underline 8px under a span
  const sp=$(spanId).getBoundingClientRect(),s=st.getBoundingClientRect(),u=$(ulId);
  Object.assign(u.style,{left:(sp.left-s.left-6)+'px',top:(sp.bottom-s.top+4)+'px',width:(sp.width+12)+'px'});
}

// ===== seek(t): the only entry point; no clocks, no state between frames =====
const SEEDS_R=[3,11,19], SEEDS_B=[5,13,23];
window.seek=(t)=>{
  t=Math.max(0,Math.min(TOTAL-1e-6,t));
  // texture: paper breathes on fours, ink edges boil on fours, grain crawls on twos
  $('paper').style.backgroundImage=`url(${GR}paper_${held(t,4)%3}.png)`;
  $('tRough').setAttribute('seed',SEEDS_R[held(t,4)%3]);
  $('tRoughB').setAttribute('seed',SEEDS_B[held(t,4)%3]);
  $('tGrain').setAttribute('seed',1+held(t,2)%40);
  const scene=t<T_ROSTER?'sHook':t<T_LINEUP?'sRoster':t<T_CLOSE?'sLine':'sClose';
  ['sHook','sRoster','sLine','sClose'].forEach(s=>$(s).style.visibility=s===scene?'visible':'hidden');

  if(scene==='sHook'){
    stamp($('pHook'),t,0);stamp($('fHook'),t,0);push($('pHook'),t,0,2);
    stamp($('hk1'),t,.25);stamp($('hk2'),t,.6);
    wipe($('ulHook'),t,.95);
  }
  if(scene==='sRoster'){
    const i=Math.min(4,Math.floor((t-T_ROSTER)/SEG)),t0=T_ROSTER+i*SEG;
    ROSTER.forEach((r,k)=>{$('pR'+k).style.visibility=k===i?'inherit':'hidden';$('nR'+k).style.visibility='hidden';});
    stamp($('pR'+i),t,t0);push($('pR'+i),t,t0,SEG);
    stamp($('nR'+i),t,t0+2/FPS);
    // thumbs cut in on the first roster beat, 3 frames apart; the active one is full strength
    ROSTER.forEach((r,k)=>{cutIn($('th'+k),t,T_ROSTER+k*3/FPS);$('thp'+k).style.opacity=k===i?1:.55;});
    const c=$('cR');c.style.left=(M+i*196-46)+'px';sweep(c,t,t0+3/FPS);
  }
  if(scene==='sLine'){
    ROSTER.forEach((r,k)=>stamp($('ls'+k),t,T_LINEUP+k*3/FPS));
    stamp($('hLine'),t,T_LINEUP+.6);wipe($('ulLine'),t,T_LINEUP+.95);
  }
  if(scene==='sClose'){
    stamp($('pClose'),t,T_CLOSE);push($('pClose'),t,T_CLOSE,2,.03);
    stamp($('shop'),t,T_CLOSE+.25);sweep($('cClose'),t,T_CLOSE+.45,6,-160);
    wipe($('arClose'),t,T_CLOSE+.95,5,false);
    cutIn($('url'),t,T_CLOSE+.55);
  }
  if($('hud'))$('hud').textContent=`${t.toFixed(2)}s  f${frame(t)}`;
};

// ===== Fit headlines by measurement, place underlines, then ready =====
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))]).then(()=>{
  document.querySelectorAll('[data-fit]').forEach(el=>{const maxW=+el.dataset.fit;let s=+el.dataset.max;el.style.fontSize=s+'px';while(el.scrollWidth>maxW&&s>24){s-=2;el.style.fontSize=s+'px';}});
  // measure with the scenes visible, then hand control to seek
  ['sHook','sLine'].forEach(s=>$(s).style.visibility='visible');underline('hkW','ulHook');underline('lnW','ulLine');
  seek(0);
  if(location.search.includes('export'))$('hud').remove();
  window.ready=true;
});

// ===== Preview controls (only clock in the file; the render never uses it) =====
let playing=false,pt=0,last=0;
function loop(ts){if(!playing)return;pt+=(ts-last)/1000;last=ts;if(pt>=TOTAL)pt=0;seek(pt);requestAnimationFrame(loop);}
addEventListener('keydown',e=>{
  if(e.code==='Space'){playing=!playing;last=performance.now();if(playing)requestAnimationFrame(loop);}
  if(e.code==='ArrowRight'){playing=false;pt=Math.min(TOTAL,pt+1/FPS);seek(pt);}
  if(e.code==='ArrowLeft'){playing=false;pt=Math.max(0,pt-1/FPS);seek(pt);}
  if(e.code==='KeyR'){pt=0;seek(0);}
});
</script>
</body>
</html>
